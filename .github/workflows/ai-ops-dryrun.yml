name: KI-Suche Betriebs-Trockenlauf

# Lesender Trockenlauf des Betriebsrunners AUSSCHLIESSLICH auf der
# TESTumgebung KursNavi (omoapbvfligjfznzivyu). Laeuft NICHT automatisch und
# NICHT als Teil der normalen CI: Ausloeser ist das bewusste Setzen des Labels
# "ki-betrieb-trockenlauf" an einem Pull Request (ein Label = ein Lauf).
#
# Fest verdrahtet: Aufruf OHNE jeden Schalter. Keine Ausfuehrungsbestaetigung,
# kein Modellschluessel, keine Modellfreigabe – damit sind Index-,
# Embedding- und Loeschschritte technisch ausgeschlossen (der Runner verweigert
# sie). Keine Laufsperre, kein Mailversand, kein Scheduler. Schluesselwerte
# erscheinen nicht im Log.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ki-betrieb-trockenlauf
  cancel-in-progress: false

jobs:
  dryrun:
    if: github.event.label.name == 'ki-betrieb-trockenlauf'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Betriebs-Trockenlauf (nur lesend, nur TESTumgebung)
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SECRET_KEY_TEST: ${{ secrets.SUPABASE_SECRET_KEY_TEST }}
          SUPABASE_PUBLISHABLE_KEY_TEST: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_TEST }}
        run: npm run ops:ai-test
