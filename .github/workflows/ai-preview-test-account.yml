name: KI-Suche Preview-Testkonto

# Legt ein bestaetigtes Lernenden-Testkonto AUSSCHLIESSLICH in der
# TESTumgebung KursNavi (omoapbvfligjfznzivyu) an. Ausloeser: Label
# "ki-testkonto" an einem Pull Request. E-Mail und Passwort stammen aus den
# Repository-Secrets PREVIEW_TEST_EMAIL / PREVIEW_TEST_PASSWORD (von der
# Nutzerin selbst hinterlegt) und erscheinen nicht im Log.

on:
  pull_request:
    types: [labeled]

jobs:
  account:
    if: github.event.label.name == 'ki-testkonto'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Testkonto anlegen (nur TESTumgebung)
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SECRET_KEY_TEST: ${{ secrets.SUPABASE_SECRET_KEY_TEST }}
          SUPABASE_PUBLISHABLE_KEY_TEST: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_TEST }}
          PREVIEW_TEST_EMAIL: ${{ secrets.PREVIEW_TEST_EMAIL }}
          PREVIEW_TEST_PASSWORD: ${{ secrets.PREVIEW_TEST_PASSWORD }}
        run: node scripts/ai-search-preview-account.mjs
