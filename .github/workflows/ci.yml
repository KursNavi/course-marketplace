name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    # Gepinnt auf 24.04: ubuntu-latest zeigt seit Ende Oktober 2026 auf 26.04,
    # das Playwright 1.58.2 (noch) nicht unterstuetzt (chromium-Install schlaegt fehl).
    runs-on: ubuntu-24.04
    env:
      HAS_E2E_SECRETS: ${{ secrets.SUPABASE_URL_TEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Laeuft bewusst direkt nach npm ci, unabhaengig von Lint/Tests/E2E:
      # ein Build- bzw. Modulaufloesungsfehler (z.B. in scripts/prerender-static.mjs)
      # soll sofort auffallen und nicht durch einen spaeter fehlschlagenden,
      # unabhaengigen Schritt maskiert werden.
      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Schlaegt an, sobald eine Produktionsabhaengigkeit eine bekannte Luecke
      # ab Schweregrad "high" hat. Dev-Abhaengigkeiten landen nicht beim
      # Besucher und wuerden den Lauf sonst dauerhaft rot faerben.
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Check text encoding
        run: npm run check:mojibake

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: E2E (harness)
        run: npm run test:e2e:harness

      # Echte DB-Tests der KI-Such-Grundlage gegen die TESTumgebung
      # (omoapbvfligjfznzivyu): parallele Reservierungen, gleichzeitige
      # identische request_ids und HTTP-Zugriff mit anon-/Servicerolle.
      # Bewusst OHNE Skip-Bedingung: das Skript prueft die Zieladresse
      # strikt (checkTargetUrl) und bricht bei fehlenden Variablen oder
      # abweichendem Ziel ab — keine Ersatzkonfiguration, kein stilles
      # Ueberspringen. Kein Seeding, kein globales Cleanup
      # (AI_DB_TESTS_ALLOW_GLOBAL_CLEANUP bleibt ungesetzt); eigene
      # Testkennungen werden auch bei Fehlern im finally bereinigt.
      - name: KI-Suche DB-Tests (TESTumgebung)
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_PUBLISHABLE_KEY_TEST: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_TEST }}
          SUPABASE_SECRET_KEY_TEST: ${{ secrets.SUPABASE_SECRET_KEY_TEST }}
          # Migration „ai_search_result_store_and_guard“ ist auf TEST angewendet:
          # Abschnitt 10 (Ergebnisspeicher/Bremse) muss laufen, Überspringen = Fehler.
          AI_DB_TESTS_REQUIRE_RESULT_STORE: '1'
          # Laufsperre v2 (Migration 20261121225750) ist auf TEST angewendet:
          # Abschnitt 11 muss laufen, Überspringen = Fehler.
          AI_DB_TESTS_REQUIRE_OPS_LEASE: '1'
        run: npm run test:ai-db

      - name: E2E (app — hybrid)
        if: env.HAS_E2E_SECRETS != ''
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_PUBLISHABLE_KEY_TEST: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_TEST }}
          SUPABASE_SECRET_KEY_TEST: ${{ secrets.SUPABASE_SECRET_KEY_TEST }}
          E2E_PROVIDER_EMAIL: ${{ secrets.E2E_PROVIDER_EMAIL }}
          E2E_PROVIDER_PASSWORD: ${{ secrets.E2E_PROVIDER_PASSWORD }}
          E2E_PROVIDER_ID: ${{ secrets.E2E_PROVIDER_ID }}
          E2E_LEARNER_EMAIL: ${{ secrets.E2E_LEARNER_EMAIL }}
          E2E_LEARNER_PASSWORD: ${{ secrets.E2E_LEARNER_PASSWORD }}
          E2E_LEARNER_ID: ${{ secrets.E2E_LEARNER_ID }}
        run: |
          npm run seed:e2e
          npm run test:e2e:app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
