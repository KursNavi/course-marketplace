name: KI-Suche Testbefuellung

# Begrenzter Stufe-1-Backfill der KI-Suche AUSSCHLIESSLICH auf der
# TESTumgebung KursNavi (omoapbvfligjfznzivyu). Laeuft NICHT automatisch bei
# jedem Push: Ausloeser ist das bewusste Setzen des Labels
# "ki-befuellung-test" an einem Pull Request (freigegeben am 17.11.2026).
#
# Schutz: scripts/ai-search-backfill-test.mjs prueft die Zieladresse strikt
# (nur omoapbvfligjfznzivyu) und verlangt AI_BACKFILL_CONFIRM. Kein globaler
# Kontingent-Cleanup, kein Mailversand, keine Modellaufrufe, keine
# Aenderung an Quellkursen. Schluesselwerte erscheinen nicht im Log.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ki-befuellung-test
  cancel-in-progress: false

jobs:
  backfill:
    if: github.event.label.name == 'ki-befuellung-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Testbefuellung (nur TESTumgebung)
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SECRET_KEY_TEST: ${{ secrets.SUPABASE_SECRET_KEY_TEST }}
          SUPABASE_PUBLISHABLE_KEY_TEST: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_TEST }}
          AI_BACKFILL_CONFIRM: omoapbvfligjfznzivyu
        run: npm run backfill:ai-test
